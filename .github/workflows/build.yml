name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Un nouveau push annule le run précédent de la même branche (les runs Android durent ~15 min).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Job 1: Build Android (debug APK + signed release APK + AAB) ──────────────
  build-apk:
    name: Build APK / AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # setup-gradle installe Gradle 8.6 et gère le cache — plus aucun téléchargement
      # réseau dans le wrapper (networkTimeout irrelevant).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          build-root-directory: .
          cache-read-only: false

      # Régénère le wrapper JAR depuis le Gradle 8.6 installé ci-dessus.
      # --no-validate-url évite une requête réseau de validation.
      - name: Regenerate wrapper JAR
        run: |
          gradle wrapper --gradle-version 8.6 --no-validate-url
          chmod +x gradlew

      # google-services.json est gitignored. On injecte un placeholder structurellement
      # valide pour que le plugin parse sans erreur. Les appels Firebase échouent au
      # runtime uniquement (attendu en CI).
      # Debug applicationId = com.netpopup.debug (applicationIdSuffix = ".debug")
      # Le plugin google-services cherche ce package exact dans le JSON — sans entrée
      # matching il échoue avec "No matching client found". On déclare les deux.
      - name: Create google-services.json placeholder
        run: |
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "netpopup-placeholder",
              "storage_bucket": "netpopup-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:00000000000000000000000000000000",
                  "android_client_info": { "package_name": "com.netpopup" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyA-PLACEHOLDER-REPLACE-WITH-REAL-KEY" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:00000000000000000000000000000001",
                  "android_client_info": { "package_name": "com.netpopup.debug" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyA-PLACEHOLDER-REPLACE-WITH-REAL-KEY" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      # ── Debug APK (4 étapes isolées pour identifier l'erreur exacte) ─────────
      - name: "Phase 1 — KSP annotation processing"
        shell: bash
        env:
          JAVA_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: gradle kspDebugKotlin --no-daemon --max-workers=1

      - name: "Phase 2 — Kotlin compilation"
        shell: bash
        env:
          JAVA_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: gradle compileDebugKotlin --no-daemon --max-workers=1

      - name: "Phase 3 — AAPT2 resource linking"
        shell: bash
        env:
          JAVA_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: gradle processDebugResources --no-daemon --max-workers=1

      - name: "Phase 4 — Assemble debug APK"
        shell: bash
        env:
          JAVA_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: gradle assembleDebug --no-daemon --max-workers=1


      # Permissions réellement présentes dans l'APK (manifeste fusionné, dépendances comprises).
      - name: "Merged manifest — permissions"
        shell: bash
        run: |
          f=$(find app/build/intermediates -path '*debug*' -name AndroidManifest.xml | grep -i merged | head -1)
          echo "manifeste : $f"
          {
            echo "### Permissions du manifeste fusionné (debug)"
            grep -o 'uses-permission[^>]*android:name="[^"]*"[^>]*' "$f" | sed 's/.*android:name="\([^"]*\)"\(.*\)/- \1\2/'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: "Unit tests — JVM core modules"
        shell: bash
        env:
          JAVA_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: gradle :core-dtn:test :core-crypto:test :store-sql:test :mesh-engine:test --no-daemon --max-workers=1

      # Tests unitaires des modules Android : la logique du transport Nearby est du Kotlin pur,
      # mais le test de permissions lit le vrai AndroidManifest.xml du module.
      - name: "Unit tests — Android modules"
        shell: bash
        env:
          JAVA_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: gradle :transport-nearby:testDebugUnitTest :app:testDebugUnitTest --no-daemon --max-workers=1

      # Lint des modules Android : toute erreur de sévérité « error » fait échouer la CI (mesh-03).
      # Les rapports sont publiés dans tous les cas.
      - name: "Lint — Android modules"
        shell: bash
        env:
          JAVA_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: gradle :app:lintDebug :transport-nearby:lintDebug --no-daemon --max-workers=1

      - name: "Lint — errors"
        if: always()
        shell: bash
        run: |
          for f in app/build/intermediates/lint_intermediate_text_report/debug/lint-results-debug.txt transport-nearby/build/intermediates/lint_intermediate_text_report/debug/lint-results-debug.txt; do
            [ -f "$f" ] || continue
            echo "== $f"
            grep -A4 -E '(^|: )Error: ' "$f" | head -120 || true   # aucune erreur : grep renvoie 1, ce n'est pas un échec
          done

      - name: "Lint — summary"
        if: always()
        shell: bash
        run: |
          {
            echo "### Android Lint"
            for f in app/build/reports/lint-results-debug.xml transport-nearby/build/reports/lint-results-debug.xml; do
              [ -f "$f" ] || { echo "- $f : absent"; continue; }
              echo "- \`$f\` : $(grep -c '<issue ' "$f") issue(s) — $(grep -o 'severity="[A-Za-z]*"' "$f" | sort | uniq -c | tr '\n' ' ')"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml
          if-no-files-found: ignore

      - name: "Debug APK — checksum and summary"
        shell: bash
        run: |
          {
            echo "### APK debug pour les essais terrain"
            ls -l app/build/outputs/apk/debug/*.apk | awk '{printf "- %s : %.1f Mo\n", $9, $5/1048576}'
            echo "- SHA-256 : \`$(sha256sum app/build/outputs/apk/debug/*.apk | cut -d' ' -f1)\`"
            echo "- commit : \`${GITHUB_SHA}\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: netpopup-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # ── Keystore CI généré à la volée (pas de secrets nécessaires) ───────────
      - name: Generate CI keystore
        run: |
          keytool -genkeypair \
            -keystore app/ci.keystore \
            -alias     release \
            -keyalg    RSA \
            -keysize   2048 \
            -validity  365 \
            -storepass ci_password \
            -keypass   ci_password \
            -dname     "CN=CI, OU=CI, O=NetPopUp, L=CI, ST=CI, C=FR" \
            -noprompt

      # ── Release APK signé ─────────────────────────────────────────────────────
      - name: Build signed release APK
        run: |
          ./gradlew assembleRelease --no-daemon \
            "-Pandroid.injected.signing.store.file=${GITHUB_WORKSPACE}/app/ci.keystore" \
            "-Pandroid.injected.signing.store.password=ci_password" \
            "-Pandroid.injected.signing.key.alias=release" \
            "-Pandroid.injected.signing.key.password=ci_password"

      - name: Report APK sizes
        run: |
          {
            echo "### Taille des APK"
            ls -l app/build/outputs/apk/*/*.apk | awk '{printf "- %s : %.1f Mo\n", $9, $5/1048576}'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: netpopup-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      # ── AAB (Play Store) ──────────────────────────────────────────────────────
      - name: Build release AAB
        run: |
          ./gradlew bundleRelease --no-daemon \
            "-Pandroid.injected.signing.store.file=${GITHUB_WORKSPACE}/app/ci.keystore" \
            "-Pandroid.injected.signing.store.password=ci_password" \
            "-Pandroid.injected.signing.key.alias=release" \
            "-Pandroid.injected.signing.key.password=ci_password"

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: netpopup-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

  # ── Job 2: Build summary ──────────────────────────────────────────────────────
  summary:
    name: Build Result
    runs-on: ubuntu-latest
    needs: [build-apk]
    if: always()
    steps:
      - name: Write job summary
        run: |
          echo "## NetPopUp Build Result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | ${{ needs.build-apk.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Run | #${{ github.run_number }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`netpopup-debug-apk\` — APK debug (Quick)" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`netpopup-release-apk\` — APK release signé (Production)" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`netpopup-release-aab\` — Bundle AAB (Play Store)" >> "$GITHUB_STEP_SUMMARY"
