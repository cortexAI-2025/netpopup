name: Android Build

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore google-services.json (placeholder)
        # In CI, use the placeholder already committed.
        # For a real Firebase project, store the real file as a secret:
        #   Settings → Secrets → GOOGLE_SERVICES_JSON (base64-encoded)
        # Then uncomment the two lines below and remove this comment block.
        # run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json
        run: echo "Using committed google-services.json placeholder"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: netpopup-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  build-release:
    name: Build Release APK (signed)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only run on pushes to main (not on PRs — secrets not available on forks)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-debug

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        # Store your keystore as a base64 secret:
        #   base64 -w 0 netpopup-release.jks | pbcopy
        # Then add to GitHub Secrets: KEYSTORE_BASE64
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > netpopup-release.jks

      - name: Write keystore.properties
        run: |
          cat > keystore.properties <<EOF
          storeFile=../netpopup-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Write google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: netpopup-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Build release AAB (Play Store)
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: netpopup-release-aab-${{ github.sha }}
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
